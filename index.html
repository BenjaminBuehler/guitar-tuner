<!DOCTYPE html>
<html>

<head>
  <base target="_top">
<meta
  name="viewport"
  content="width=device-width, initial-scale=1, viewport-fit=cover"
>
  <style>
    :root {
      color-scheme: dark;
      font-family: Arial, Helvetica, sans-serif;
    }

    * {
      box-sizing: border-box;
    }

   body {
  width: 100%;
  min-height: 100%;
}

body {
  margin: 0;
  width: 100%;
  min-height: 100vh;
  min-height: 100dvh;
  display: flex;
  justify-content: center;
  align-items: center;
  padding: 20px;
  background:
    radial-gradient(circle at top, #233554 0, #0f172a 55%, #020617 100%);
  color: #f8fafc;
}

    .app {
      width: min(520px, 100%);
      padding: 28px;
      border: 1px solid rgba(255, 255, 255, 0.12);
      border-radius: 22px;
      background: rgba(15, 23, 42, 0.92);
      box-shadow: 0 25px 60px rgba(0, 0, 0, 0.4);
      text-align: center;
    }

    h1 {
      margin: 0 0 4px;
      font-size: 28px;
    }

    .subtitle {
      margin: 0 0 24px;
      color: #94a3b8;
      font-size: 14px;
    }

    .note {
      min-height: 112px;
      font-size: 92px;
      font-weight: 700;
      line-height: 1;
      letter-spacing: -4px;
    }

    .frequency {
      min-height: 26px;
      margin-top: 6px;
      color: #cbd5e1;
      font-size: 19px;
    }

    .tuning-status {
      min-height: 26px;
      margin-top: 8px;
      font-size: 18px;
      font-weight: 700;
    }

    .meter-labels {
      display: flex;
      justify-content: space-between;
      margin-top: 24px;
      color: #94a3b8;
      font-size: 12px;
    }

    .meter {
      position: relative;
      height: 54px;
      margin-top: 7px;
      overflow: hidden;
      border-radius: 10px;
      background:
        linear-gradient(90deg,
          #7f1d1d 0%,
          #ca8a04 30%,
          #15803d 46%,
          #15803d 54%,
          #ca8a04 70%,
          #7f1d1d 100%);
    }

    .meter::after {
      content: "";
      position: absolute;
      top: 0;
      bottom: 0;
      left: 50%;
      width: 2px;
      background: rgba(255, 255, 255, 0.75);
      transform: translateX(-50%);
    }

    .needle {
      position: absolute;
      top: 5px;
      bottom: 5px;
      left: 50%;
      z-index: 2;
      width: 5px;
      border-radius: 10px;
      background: white;
      box-shadow: 0 0 12px rgba(255, 255, 255, 0.9);
      transform: translateX(-50%);
      transition: left 90ms linear;
    }

    .cents {
      min-height: 24px;
      margin-top: 12px;
      color: #cbd5e1;
      font-variant-numeric: tabular-nums;
    }

    .controls {
      display: flex;
      gap: 12px;
      justify-content: center;
      margin-top: 24px;
    }

    button {
      min-width: 130px;
      padding: 12px 18px;
      border: 0;
      border-radius: 10px;
      cursor: pointer;
      font-size: 16px;
      font-weight: 700;
    }

    #startButton {
      background: #22c55e;
      color: #052e16;
    }

    #startButton:hover {
      background: #4ade80;
    }

    #stopButton {
      background: #334155;
      color: #f8fafc;
    }

    #stopButton:disabled {
      cursor: not-allowed;
      opacity: 0.45;
    }

.calibration {
  flex-wrap: wrap;
}

.calibration select {
  min-width: 140px;
  padding: 7px;
  border: 1px solid #475569;
  border-radius: 7px;
  background: #0f172a;
  color: white;
  font-size: 14px;
  text-align: center;
}
    
    .calibration {
      display: flex;
      gap: 12px;
      align-items: center;
      justify-content: center;
      margin-top: 22px;
      color: #cbd5e1;
      font-size: 14px;
    }

    .calibration input {
      width: 90px;
      padding: 7px;
      border: 1px solid #475569;
      border-radius: 7px;
      background: #0f172a;
      color: white;
      font-size: 14px;
      text-align: center;
    }

 .tuning-picker {
  display: grid;
  gap: 10px;
  margin-top: 22px;
  text-align: left;
}

.tuning-picker > label {
  color: #cbd5e1;
  font-size: 14px;
  font-weight: 700;
}

.tuning-picker select,
.tuning-picker input {
  width: 100%;
  padding: 10px;
  border: 1px solid #475569;
  border-radius: 8px;
  background: #0f172a;
  color: #f8fafc;
  font-size: 14px;
}

.tuning-picker select:focus,
.tuning-picker input:focus {
  border-color: #22c55e;
  outline: 2px solid rgba(34, 197, 94, 0.18);
}

.selected-tuning {
  min-height: 50px;
  padding: 14px;
  border-radius: 10px;
  background: rgba(255, 255, 255, 0.05);
  color: #94a3b8;
  font-size: 13px;
  line-height: 1.65;
  overflow-wrap: anywhere;
}

.selected-tuning strong {
  margin-left: 4px;
  color: #e2e8f0;
}

    .message {
      min-height: 40px;
      margin-top: 18px;
      color: #94a3b8;
      font-size: 13px;
      line-height: 1.45;
    }

    .good {
      color: #4ade80;
    }

    .warning {
      color: #facc15;
    }

    .bad {
      color: #f87171;
    }
@media (max-width: 640px) {
  body {
    display: block;
    padding: 0;
    background: #0f172a;
  }

  .app {
    width: 100%;
    min-height: 100vh;
    min-height: 100dvh;
    padding:
      max(20px, env(safe-area-inset-top))
      max(18px, env(safe-area-inset-right))
      max(24px, env(safe-area-inset-bottom))
      max(18px, env(safe-area-inset-left));
    border: 0;
    border-radius: 0;
    box-shadow: none;
  }

  h1 {
    font-size: clamp(24px, 7vw, 30px);
  }

  .subtitle {
    margin-bottom: 18px;
  }

  .note {
    min-height: 92px;
    font-size: clamp(68px, 24vw, 92px);
  }

  .frequency {
    font-size: clamp(15px, 4.5vw, 19px);
  }

  .controls {
    flex-direction: column;
    width: 100%;
  }

  .controls button {
    width: 100%;
    min-width: 0;
    min-height: 48px;
  }

  .calibration {
    justify-content: space-between;
  }

  /*
   * A font size of at least 16px prevents iOS Safari from zooming
   * the page when an input or select receives focus.
   */
  .calibration input,
  .calibration select,
  .tuning-picker input,
  .tuning-picker select {
    font-size: 16px;
    min-height: 44px;
  }

  .meter {
    height: 60px;
  }
}
@media (max-height: 700px) and (max-width: 900px) {
  .app {
    padding-top: max(12px, env(safe-area-inset-top));
    padding-bottom: max(16px, env(safe-area-inset-bottom));
  }

  .subtitle {
    margin-bottom: 10px;
  }

  .note {
    min-height: 68px;
    font-size: 64px;
  }

  .meter-labels {
    margin-top: 14px;
  }

  .controls,
  .calibration,
  .tuning-picker,
  .message {
    margin-top: 14px;
  }
}
    
  </style>
</head>

<body>
  <main class="app">
    <h1>Guitar Tuner</h1>
    <p class="subtitle">Chromatic pitch detection from A0 to C8</p>

    <div id="note" class="note">--</div>
    <div id="frequency" class="frequency">Press Start Tuner</div>
    <div id="tuningStatus" class="tuning-status"></div>

    <div class="meter-labels">
      <span>♭ Flat</span>
      <span>In tune</span>
      <span>Sharp ♯</span>
    </div>

    <div class="meter">
      <div id="needle" class="needle"></div>
    </div>

    <div id="cents" class="cents">0 cents</div>

    <div class="controls">
      <button id="startButton" type="button">Start Tuner</button>
      <button id="stopButton" type="button" disabled>Stop</button>
    </div>

   <div class="calibration">
  <label for="referencePitch">Reference A4</label>
  <input
    id="referencePitch"
    type="number"
    min="430"
    max="450"
    step="1"
    value="440"
  >
  <span>Hz</span>

  <label for="notation">Notation</label>
  <select id="notation">
    <option value="sharp">Sharps (♯)</option>
    <option value="flat">Flats (♭)</option>
  </select>
</div>

  <div class="tuning-picker">
  <label for="tuningSelect">Instrument tuning</label>

  <select id="tuningSelect"></select>

  <input
    id="customTuning"
    type="text"
    placeholder="Example: E2 A2 D3 G3 B3 E4"
    aria-label="Custom tuning notes"
    hidden
  >

  <div id="selectedTuning" class="selected-tuning">
    <span id="selectedTuningName">Standard:</span>
    <strong id="selectedTuningNotes">
      E2 · A2 · D3 · G3 · B3 · E4
    </strong>
  </div>
</div>

    <div id="message" class="message">
      Microphone audio is processed locally and is not uploaded.
    </div>
  </main>

        'Csus2add11',
        'C.G.D.F.C.F'
      ),
      makeTuning(
        'golden-blue',
        'Golden Blue',
        'C.C.C.C.A#.F'
      )
    ]
  },
  {
    label: 'Miscellaneous Tunings',
    tunings: [
      makeTuning(
        'cooder',
        'Cooder',
        'C#.G#.C#.F.G#.C#'
      ),
      makeTuning('collins', 'Collins', 'F.C.F.G#.C.F'),
      makeTuning('cadgbe', 'CADGBE', 'C.A.D.G.B.E'),
      makeTuning('daeaee', 'DAEAEE', 'D.A.E.A.E.E')
    ]
  }
];

const tuningsById = new Map();

function makeTuning(
  id,
  name,
  noteSequence,
  startingOctave = 2
) {
  return {
    id,
    name,
    notes: createAscendingMidiNotes(
      noteSequence.split('.'),
      startingOctave
    )
  };
}

function makeExplicitTuning(id, name, notes) {
  return {
    id,
    name,
    notes: notes.map(noteNameToMidi)
  };
}

function makeCustomTuning() {
  return {
    id: 'custom',
    name: 'Custom',
    notes: [],
    custom: true
  };
}

/*
 * Assign octaves so each string is at least as high as the previous
 * string. Equal notes remain in the same octave, which supports
 * tunings containing unison strings.
 */
function createAscendingMidiNotes(
  noteNames,
  startingOctave
) {
  const notes = [];
  let previousMidi = null;

  noteNames.forEach(function(noteName, index) {
    const normalizedName = normalizePitchClass(noteName);

    if (!(normalizedName in pitchClassNumbers)) {
      throw new Error('Unknown pitch class: ' + noteName);
    }

    let octave = startingOctave;
    let midi =
      12 * (octave + 1) +
      pitchClassNumbers[normalizedName];

    if (index > 0) {
      while (midi < previousMidi) {
        octave++;
        midi =
          12 * (octave + 1) +
          pitchClassNumbers[normalizedName];
      }
    }

    notes.push(midi);
    previousMidi = midi;
  });

  return notes;
}

function normalizePitchClass(noteName) {
  return noteName
    .trim()
    .replace(/♯/g, '#')
    .replace(/♭/g, 'b');
}

function noteNameToMidi(noteName) {
  const normalized = normalizePitchClass(noteName);

  const match = normalized.match(
    /^([A-Ga-g])([#b]?)(-?\d+)$/
  );

  if (!match) {
    throw new Error('Invalid note: ' + noteName);
  }

  const letter = match[1].toUpperCase();
  const accidental = match[2];
  const octave = Number(match[3]);
  const pitchClass = letter + accidental;

  if (!(pitchClass in pitchClassNumbers)) {
    throw new Error('Invalid note: ' + noteName);
  }

  return (
    12 * (octave + 1) +
    pitchClassNumbers[pitchClass]
  );
}

function midiToDisplayName(midiNote) {
  const pitchClass = positiveModulo(midiNote, 12);
  const octave = Math.floor(midiNote / 12) - 1;

  const names = notationSelect.value === 'flat'
    ? displayFlatNames
    : displaySharpNames;

  return names[pitchClass] + octave;
}

function populateTuningSelector() {
  if (!tuningSelect) {
    console.error(
      'The element <select id="tuningSelect"> was not found.'
    );
    return;
  }

  tuningSelect.replaceChildren();
  tuningsById.clear();

  const fragment = document.createDocumentFragment();

  tuningGroups.forEach(function(group) {
    const optgroup = document.createElement('optgroup');
    optgroup.label = group.label;

    group.tunings.forEach(function(tuning) {
      tuningsById.set(tuning.id, tuning);

      const option = document.createElement('option');
      option.value = tuning.id;
      option.textContent = '♬ ' + tuning.name;

      optgroup.appendChild(option);
    });

    fragment.appendChild(optgroup);
  });

  tuningSelect.appendChild(fragment);
  tuningSelect.value = 'standard';

  renderSelectedTuning();
}

function renderSelectedTuning() {
  const tuning = tuningsById.get(tuningSelect.value);

  if (!tuning) {
    return;
  }

  const isCustom = Boolean(tuning.custom);

  customTuningInput.hidden = !isCustom;
  selectedTuningName.textContent = tuning.name + ':';

  if (isCustom) {
    renderCustomTuning();
    return;
  }

  selectedTuningNotes.textContent = tuning.notes
    .map(midiToDisplayName)
    .join(' · ');
}

function renderCustomTuning() {
  const text = customTuningInput.value.trim();

  if (!text) {
    selectedTuningNotes.textContent =
      'Enter octave-qualified notes above';
    return;
  }

  const noteStrings = text
    .replace(/[,.]/g, ' ')
    .split(/\s+/)
    .filter(Boolean);

  try {
    const midiNotes = noteStrings.map(noteNameToMidi);

    const outOfRange = midiNotes.some(function(midiNote) {
      return (
        midiNote < MIN_MIDI_NOTE ||
        midiNote > MAX_MIDI_NOTE
      );
    });

    if (outOfRange) {
      selectedTuningNotes.textContent =
        'Custom notes must be between A0 and C8';
      return;
    }

    selectedTuningNotes.textContent = midiNotes
      .map(midiToDisplayName)
      .join(' · ');
  } catch (error) {
    selectedTuningNotes.textContent =
      'Use notes such as E2 A2 D3 G3 B3 E4';
  }
}


  async function startTuner() {
    if (
      !navigator.mediaDevices ||
      !navigator.mediaDevices.getUserMedia
    ) {
      showError(
        'This browser does not support microphone access through getUserMedia().'
      );
      return;
    }

    startButton.disabled = true;
    messageElement.className = 'message';
    messageElement.textContent =
      'Requesting microphone permission...';

    try {
      microphoneStream =
        await navigator.mediaDevices.getUserMedia({
          audio: {
            echoCancellation: false,
            noiseSuppression: false,
            autoGainControl: false,
            channelCount: 1
          },
          video: false
        });

      audioContext = new (
        window.AudioContext || window.webkitAudioContext
      )();

      await audioContext.resume();

      analyser = audioContext.createAnalyser();

      /*
       * An 8192-sample window is large enough to analyze the long
       * wavelength of A0 while retaining enough resolution for C8.
       */
      analyser.fftSize = 8192;
      analyser.smoothingTimeConstant = 0;

      microphoneSource =
        audioContext.createMediaStreamSource(microphoneStream);

      microphoneSource.connect(analyser);

      // Do not connect to audioContext.destination because doing so
      // would play the microphone through the speakers.
      sampleBuffer = new Float32Array(analyser.fftSize);

      recentFrequencies = [];
      missedReadings = 0;
      lastDisplayedFrequency = null;

      stopButton.disabled = false;
      messageElement.textContent =
        'Listening for notes from A0 to C8.';

      analysisTimer = window.setInterval(analyzeAudio, 100);
    } catch (error) {
      console.error(error);
      await cleanUpAudio();

      startButton.disabled = false;
      stopButton.disabled = true;

      let message = 'Microphone access failed.';

      if (error.name === 'NotAllowedError') {
        message +=
          ' Permission was denied or microphone access was blocked by the browser.';
      } else if (error.name === 'NotFoundError') {
        message += ' No microphone was found.';
      } else if (error.message) {
        message += ' ' + error.message;
      }

      showError(message);
    }
  }

  async function stopTuner() {
    await cleanUpAudio();

    startButton.disabled = false;
    stopButton.disabled = true;

    resetPitchDisplay('Tuner stopped');

    messageElement.className = 'message';
    messageElement.textContent =
      'Microphone audio is processed locally and is not uploaded.';
  }

  async function cleanUpAudio() {
    if (analysisTimer !== null) {
      clearInterval(analysisTimer);
      analysisTimer = null;
    }

    if (microphoneSource) {
      try {
        microphoneSource.disconnect();
      } catch (error) {
        console.warn(error);
      }

      microphoneSource = null;
    }

    if (microphoneStream) {
      microphoneStream.getTracks().forEach(function(track) {
        track.stop();
      });

      microphoneStream = null;
    }

    if (audioContext) {
      try {
        await audioContext.close();
      } catch (error) {
        console.warn(error);
      }

      audioContext = null;
    }

    analyser = null;
    sampleBuffer = null;
    recentFrequencies = [];
    lastDisplayedFrequency = null;
  }

  function analyzeAudio() {
    if (!analyser || !audioContext || !sampleBuffer) {
      return;
    }

    analyser.getFloatTimeDomainData(sampleBuffer);

    const referencePitch = getReferencePitch();

    /*
     * Use the half-semitone boundaries around A0 and C8. This allows
     * the end notes to be detected even when they are slightly out
     * of tune.
     */
    const minimumFrequency = midiToFrequency(
      MIN_MIDI_NOTE - 0.5,
      referencePitch
    );

    const maximumFrequency = midiToFrequency(
      MAX_MIDI_NOTE + 0.5,
      referencePitch
    );

    const frequency = detectPitch(
      sampleBuffer,
      audioContext.sampleRate,
      minimumFrequency,
      maximumFrequency
    );

    if (!frequency) {
      missedReadings++;

      if (missedReadings >= 5) {
        showNoSignal();
      }

      return;
    }

    missedReadings = 0;

    /*
     * Clear smoothing when the pitch changes substantially so the
     * display reacts quickly to a new note.
     */
    if (
      recentFrequencies.length &&
      Math.abs(
        frequency -
        recentFrequencies[recentFrequencies.length - 1]
      ) / frequency > 0.10
    ) {
      recentFrequencies = [];
    }

    recentFrequencies.push(frequency);

    if (recentFrequencies.length > 5) {
      recentFrequencies.shift();
    }

    displayPitch(median(recentFrequencies));
  }

  /**
   * YIN-style pitch detection.
   *
   * Supports the A0-C8 range, approximately 27.5-4186 Hz when
   * reference A4 is 440 Hz.
   */
  function detectPitch(
    buffer,
    sampleRate,
    minimumFrequency,
    maximumFrequency
  ) {
    let sumSquares = 0;

    for (let i = 0; i < buffer.length; i++) {
      sumSquares += buffer[i] * buffer[i];
    }

    const rms = Math.sqrt(sumSquares / buffer.length);

    // Reject silence and weak background noise.
    if (rms < 0.005) {
      return null;
    }

    const halfLength = Math.floor(buffer.length / 2);

    const minimumTau = Math.max(
      2,
      Math.floor(sampleRate / maximumFrequency)
    );

    const maximumTau = Math.min(
      halfLength - 1,
      Math.floor(sampleRate / minimumFrequency)
    );

    if (minimumTau >= maximumTau) {
      return null;
    }

    const yin = new Float32Array(maximumTau + 1);

    /*
     * Difference function. Calculate from tau 1 so that cumulative
     * normalization and interpolation remain accurate at C8.
     */
    for (let tau = 1; tau <= maximumTau; tau++) {
      let difference = 0;

      for (let i = 0; i < halfLength; i++) {
        const delta = buffer[i] - buffer[i + tau];
        difference += delta * delta;
      }

      yin[tau] = difference;
    }

    /*
     * Cumulative mean normalized difference.
     */
    yin[0] = 1;

    let runningSum = 0;

    for (let tau = 1; tau <= maximumTau; tau++) {
      runningSum += yin[tau];

      yin[tau] = runningSum === 0
        ? 1
        : yin[tau] * tau / runningSum;
    }

    const threshold = 0.15;
    let selectedTau = -1;

    for (
      let tau = minimumTau;
      tau < maximumTau;
      tau++
    ) {
      if (yin[tau] < threshold) {
        while (
          tau + 1 <= maximumTau &&
          yin[tau + 1] < yin[tau]
        ) {
          tau++;
        }

        selectedTau = tau;
        break;
      }
    }

    /*
     * Some microphones and instruments do not produce a YIN minimum
     * below the normal threshold. Use a conservative fallback when
     * there is still a reasonably clear minimum.
     */
    if (selectedTau === -1) {
      let bestValue = Infinity;

      for (
        let tau = minimumTau;
        tau <= maximumTau;
        tau++
      ) {
        if (yin[tau] < bestValue) {
          bestValue = yin[tau];
          selectedTau = tau;
        }
      }

      if (bestValue > 0.25) {
        return null;
      }
    }

    /*
     * Parabolic interpolation provides sub-sample resolution. This
     * is especially important for high notes, whose periods may be
     * only about 10 samples long.
     */
    let betterTau = selectedTau;

    if (
      selectedTau > 1 &&
      selectedTau < maximumTau
    ) {
      const previous = yin[selectedTau - 1];
      const current = yin[selectedTau];
      const next = yin[selectedTau + 1];

      const denominator =
        2 * (previous - 2 * current + next);

      if (denominator !== 0) {
        const adjustment =
          (previous - next) / denominator;

        if (Number.isFinite(adjustment)) {
          betterTau += adjustment;
        }
      }
    }

    const frequency = sampleRate / betterTau;

    if (
      !Number.isFinite(frequency) ||
      frequency < minimumFrequency ||
      frequency > maximumFrequency
    ) {
      return null;
    }

    return frequency;
  }

  function displayPitch(frequency) {
    const referencePitch = getReferencePitch();

    /*
     * MIDI 69 is A4. Notes A0-C8 correspond to MIDI 21-108.
     */
    const exactMidi =
      69 + 12 * Math.log2(frequency / referencePitch);

    const midiNote = Math.round(exactMidi);

    if (
      midiNote < MIN_MIDI_NOTE ||
      midiNote > MAX_MIDI_NOTE
    ) {
      return;
    }

    const noteIndex = positiveModulo(midiNote, 12);
    const octave = Math.floor(midiNote / 12) - 1;

    const names = notationSelect.value === 'flat'
      ? flatNoteNames
      : sharpNoteNames;

    const noteName = names[noteIndex] + octave;

    const targetFrequency = midiToFrequency(
      midiNote,
      referencePitch
    );

    const cents =
      1200 * Math.log2(frequency / targetFrequency);

    lastDisplayedFrequency = frequency;

    noteElement.textContent = noteName;

    frequencyElement.textContent =
      formatFrequency(frequency) +
      ' Hz · target ' +
      formatFrequency(targetFrequency) +
      ' Hz';

    const roundedCents = Math.round(cents);
    const sign = roundedCents > 0 ? '+' : '';

    centsElement.textContent =
      sign + roundedCents + ' cents';

    const clampedCents = Math.max(
      -50,
      Math.min(50, cents)
    );

    needleElement.style.left =
      (50 + clampedCents) + '%';

    const absoluteCents = Math.abs(cents);

    if (absoluteCents <= 5) {
      tuningStatusElement.textContent = 'In tune';
      tuningStatusElement.className =
        'tuning-status good';
    } else if (cents < 0) {
      tuningStatusElement.textContent = 'Tune up';
      tuningStatusElement.className =
        absoluteCents <= 15
          ? 'tuning-status warning'
          : 'tuning-status bad';
    } else {
      tuningStatusElement.textContent = 'Tune down';
      tuningStatusElement.className =
        absoluteCents <= 15
          ? 'tuning-status warning'
          : 'tuning-status bad';
    }
  }

  function getReferencePitch() {
    const value = Number(referencePitchInput.value);

    if (Number.isFinite(value) && value > 0) {
      return value;
    }

    return 440;
  }

  function midiToFrequency(midiNote, referencePitch) {
    return referencePitch *
      Math.pow(2, (midiNote - 69) / 12);
  }

  function formatFrequency(frequency) {
    return frequency < 100
      ? frequency.toFixed(2)
      : frequency.toFixed(1);
  }

  function showNoSignal() {
    recentFrequencies = [];
    lastDisplayedFrequency = null;

    resetPitchDisplay('No stable pitch detected');

    tuningStatusElement.textContent =
      'Play a note from A0 to C8';
  }

  function resetPitchDisplay(frequencyMessage) {
    noteElement.textContent = '--';
    frequencyElement.textContent = frequencyMessage;
    tuningStatusElement.textContent = '';
    tuningStatusElement.className = 'tuning-status';
    centsElement.textContent = '0 cents';
    needleElement.style.left = '50%';
  }

  function showError(message) {
    messageElement.className = 'message bad';
    messageElement.textContent = message;
  }

  function median(values) {
    if (!values.length) {
      return 0;
    }

    const sorted = values.slice().sort(function(a, b) {
      return a - b;
    });

    const middle = Math.floor(sorted.length / 2);

    if (sorted.length % 2) {
      return sorted[middle];
    }

    return (
      sorted[middle - 1] + sorted[middle]
    ) / 2;
  }

  function positiveModulo(value, divisor) {
    return ((value % divisor) + divisor) % divisor;
  }

    function initializeTuningControls() {
  if (
    !tuningSelect ||
    !customTuningInput ||
    !selectedTuningName ||
    !selectedTuningNotes
  ) {
    console.error(
      'One or more tuning control elements are missing from the HTML.'
    );
    return;
  }

  tuningSelect.addEventListener(
    'change',
    renderSelectedTuning
  );

  customTuningInput.addEventListener(
    'input',
    renderCustomTuning
  );

  populateTuningSelector();
}

if (document.readyState === 'loading') {
  document.addEventListener(
    'DOMContentLoaded',
    initializeTuningControls,
    { once: true }
  );
} else {
  initializeTuningControls();
}
</script>
